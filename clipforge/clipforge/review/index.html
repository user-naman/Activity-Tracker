<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge Review</title>
<style>
  :root {
    --bg: #0b0b0c; --panel: #141416; --line: #232327; --text: #f2f2f3; --muted: #8b8b92;
    --accent: #ffe14d; --ok: #3ddc84; --no: #ff5c5c; --radius: 14px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f6f4; --panel: #ffffff; --line: #e6e6e2; --text: #141414; --muted: #6b6b70; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 ui-sans-serif, -apple-system, "Inter", "Segoe UI", Roboto, sans-serif; }
  button, textarea, input { font: inherit; color: inherit; }

  header { display: flex; align-items: center; gap: 20px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header b { letter-spacing: -.01em; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab { background: none; border: 0; padding: 6px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .tab .n { margin-left: 4px; font-variant-numeric: tabular-nums; opacity: .6; }
  kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }

  main { display: grid; grid-template-columns: auto minmax(300px, 420px); gap: 28px; justify-content: center;
    align-items: start; padding: 24px 20px; height: calc(100% - 55px); }
  .stage { position: relative; height: min(82vh, 860px); aspect-ratio: 9 / 16; border-radius: var(--radius);
    overflow: hidden; background: #000; }
  .stage video { width: 100%; height: 100%; display: block; object-fit: contain; cursor: pointer; }
  .stage .badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 99px;
    font-size: 12px; font-weight: 600; background: rgba(0,0,0,.6); color: #fff; backdrop-filter: blur(6px); }
  .badge.approved { background: var(--ok); color: #04210f; }
  .badge.rejected { background: var(--no); color: #2a0606; }
  .busy::after { content: "Re-rendering…"; position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.6); color: #fff; font-weight: 600; }

  aside { display: flex; flex-direction: column; gap: 18px; padding-top: 4px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .field { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    outline: none; resize: vertical; transition: border-color .15s; }
  .field:focus { border-color: var(--accent); }
  #hook { font-weight: 700; }
  #caption { min-height: 130px; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; color: var(--muted); }
  .meta span:nth-child(even) { color: var(--text); }
  .actions { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 11px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    cursor: pointer; font-weight: 600; display: flex; justify-content: center; gap: 8px; align-items: center; }
  .btn:hover { border-color: var(--muted); }
  .btn.ok:hover { border-color: var(--ok); } .btn.no:hover { border-color: var(--no); }
  .hint { font-size: 12px; color: var(--muted); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: 13px;
    transition: all .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #help { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; }
  #help.show { display: grid; }
  #help div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 26px;
    display: grid; grid-template-columns: auto auto; gap: 8px 22px; font-size: 14px; }

  @media (max-width: 820px) {
    header { flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
    .tabs { margin-left: 0; width: 100%; }
    main { grid-template-columns: 1fr; padding: 16px; height: auto; gap: 18px; }
    .stage { height: auto; width: 100%; max-height: 72vh; margin: 0 auto; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <b>ClipForge</b>
  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="rendered" role="tab">To review <span class="n"></span></button>
    <button class="tab" data-tab="approved" role="tab">Post queue <span class="n"></span></button>
    <button class="tab" data-tab="rejected" role="tab">Rejected <span class="n"></span></button>
  </nav>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="help"><div>
  <kbd>A</kbd><span>Approve and next</span>
  <kbd>X</kbd><span>Reject and next</span>
  <kbd>U</kbd><span>Back to review</span>
  <kbd>J</kbd> <span>Next clip</span>
  <kbd>K</kbd> <span>Previous clip</span>
  <kbd>Space</kbd><span>Play / pause</span>
  <kbd>M</kbd><span>Mute</span>
  <kbd>H</kbd><span>Edit hook (Enter saves, re-renders)</span>
  <kbd>E</kbd><span>Edit caption (Esc saves)</span>
  <kbd>1 2 3</kbd><span>Switch tab</span>
</div></div>

<script>
const $ = (s) => document.querySelector(s);
let clips = [], tab = "rendered", idx = 0, muted = false;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const list = () => clips.filter((c) => c.status === tab);
const current = () => list()[idx];

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1400);
}

async function load() {
  clips = await (await fetch("/api/clips")).json();
  render();
}

function render() {
  const n = (s) => clips.filter((c) => c.status === s).length;
  document.querySelectorAll(".tab").forEach((b) => {
    b.setAttribute("aria-selected", b.dataset.tab === tab);
    b.querySelector(".n").textContent = n(b.dataset.tab) || "";
  });
  const items = list();
  idx = Math.max(0, Math.min(idx, items.length - 1));
  const c = items[idx];
  if (!c) {
    const msg = tab === "rendered"
      ? "<b>All caught up.</b>Approved clips post on schedule. Run <kbd>clipforge run</kbd> to make more."
      : "<b>Nothing here yet.</b>";
    $("#main").innerHTML = `<p class="empty">${msg}</p>`;
    return;
  }
  $("#main").innerHTML = `
    <div class="stage" id="stage">
      <video id="vid" src="${c.video}" autoplay loop playsinline ${muted ? "muted" : ""}></video>
      <span class="badge ${c.status}">${c.status === "rendered" ? `${idx + 1} / ${items.length}` : c.status}</span>
    </div>
    <aside>
      <div><label for="hook">Hook</label><input id="hook" class="field" value="${esc(c.hook)}"></div>
      <div><label for="caption">Caption</label><textarea id="caption" class="field">${esc(c.caption)}</textarea></div>
      <div class="meta">
        <span>Campaign</span><span>${esc(c.campaign)}</span>
        <span>Source</span><span>#${c.source_id} · ${fmt(c.start)}–${fmt(c.end)} (${Math.round(c.end - c.start)}s)</span>
        <span>Score</span><span>${c.score}</span>
        <span>Why</span><span>${esc(c.reason)}</span>
      </div>
      <div class="actions">
        <button class="btn no" data-act="rejected">Reject <kbd>X</kbd></button>
        <button class="btn ok" data-act="approved">Approve <kbd>A</kbd></button>
      </div>
      <p class="hint">Press <kbd>?</kbd> for all shortcuts.</p>
    </aside>`;
  $("#vid").onclick = (e) => (e.target.paused ? e.target.play() : e.target.pause());
  document.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => setStatus(b.dataset.act)));
  $("#caption").onblur = () => save({ caption: $("#caption").value }, "Caption saved");
  $("#hook").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } };
  $("#hook").onblur = () => save({ hook: $("#hook").value.trim() }, "Hook updated");
}

async function patch(id, body) {
  const r = await fetch(`/api/clips/${id}`, { method: "POST", body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Save failed");
  clips = clips.map((c) => (c.id === id ? data : c));
  return data;
}

async function save(body, msg) {
  const c = current(); if (!c) return;
  const key = Object.keys(body)[0];
  if (c[key] === body[key]) return;
  const busy = key === "hook";
  if (busy) $("#stage").classList.add("busy");
  try { await patch(c.id, body); toast(msg); } catch (e) { toast(e.message); }
  if (busy) render();
}

async function setStatus(status) {
  const c = current(); if (!c || c.status === status) return;
  await patch(c.id, { status });
  toast(status === "approved" ? "Approved → post queue" : status === "rejected" ? "Rejected" : "Back to review");
  render();
}

function move(d) { const n = list().length; if (n) { idx = (idx + d + n) % n; render(); } }

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const v = $("#vid");
  const keys = {
    a: () => setStatus("approved"), x: () => setStatus("rejected"), u: () => setStatus("rendered"),
    j: () => move(1), arrowdown: () => move(1), arrowright: () => move(1),
    k: () => move(-1), arrowup: () => move(-1), arrowleft: () => move(-1),
    " ": () => v && (v.paused ? v.play() : v.pause()),
    m: () => { muted = !muted; if (v) v.muted = muted; toast(muted ? "Muted" : "Sound on"); },
    e: () => $("#caption")?.focus(), h: () => $("#hook")?.select(),
    1: () => { tab = "rendered"; idx = 0; render(); },
    2: () => { tab = "approved"; idx = 0; render(); },
    3: () => { tab = "rejected"; idx = 0; render(); },
    "?": () => $("#help").classList.toggle("show"),
    escape: () => $("#help").classList.remove("show"),
  };
  const fn = keys[e.key.toLowerCase()];
  if (fn) { e.preventDefault(); fn(); }
});
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; idx = 0; render(); }));
$("#help").onclick = () => $("#help").classList.remove("show");
load();
</script>
</body>
</html>
